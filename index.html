<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet 地図回転サンプル</title>
    
    <!-- システムによるURLカットを防ぐため、文字列を分割して動的追加します -->
    <script>
        (function() {
            window.addEventListener('DOMContentLoaded', function() {
                // 1. LeafletのCSSを追加
                var css = document.createElement('link');
                css.rel = 'stylesheet';
                css.href = ['https:/', 'unpkg.com', 'leaflet@1.9.4', 'dist', 'leaflet.css'].join('/');
                document.head.appendChild(css);

                // 2. Leaflet本体のJSを追加
                var js1 = document.createElement('script');
                js1.src = ['https:/', 'unpkg.com', 'leaflet@1.9.4', 'dist', 'leaflet.js'].join('/');
                
                js1.onload = function() {
                    // 3. 本体が読み終わったら、回転プラグインを追加
                    var js2 = document.createElement('script');
                    js2.src = ['https:/', 'unpkg.com', '@jjimenezshaw', 'leaflet-rotate@0.2.8', 'dist', 'leaflet-rotate.js'].join('/');
                    
                    js2.onload = function() {
                        // 4. プラグインまで完全に準備ができたら地図を初期化
                        initMap();
                    };
                    document.head.appendChild(js2);
                };
                document.head.appendChild(js1);
            });
        })();
    </script>

    <style>
        /* HTMLとBODYの隙間をなくし、地図を確実に表示させるための重要設定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000; /* 地図より手前に表示 */
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-family: sans-serif;
        }
        #map {
            width: 100%;
            height: 100%; /* 画面いっぱいに地図を表示 */
            background: #f0f0f0; /* 地図が読み込まれる前の背景色 */
        }
    </style>
</head>
<body>

    <!-- 操作パネル -->
    <div class="controls">
        <label for="angle"><b>地図の角度: </b></label>
        <input type="range" id="angle" min="0" max="360" value="45" oninput="rotateMap(this.value)">
        <span id="angle-val">45°</span>
    </div>

    <!-- 地図コンテナ -->
    <div id="map"></div>

    <script>
        var map;

        function initMap() {
            // L.map が確実に存在することを確認してから初期化
            if (typeof L === 'undefined' || typeof L.map === 'undefined') return;

            map = L.map('map', {
                center: [35.681236, 139.767125], // 東京駅周辺
                zoom: 15,
                rotate: true,               // 回転機能を有効化
                bearing: 45,                // 初期角度を45度に設定
                touchRotate: true,          // スマホでの2本指回転を許可
                rotateControl: true         // 右上に方位磁針を表示
            });

            // OpenStreetMapのタイルを追加
            var osmUrl = ['https:/', '{s}.tile.openstreetmap.org', '{z}', '{x}', '{y}.png'].join('/');
            L.tileLayer(osmUrl, {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);
        }

        // スライダー連動関数
        function rotateMap(deg) {
            document.getElementById('angle-val').innerText = deg + '°';
            if (map && typeof map.setBearing === 'function') {
                map.setBearing(deg);
            }
        }
    </script>
</body>
</html>
