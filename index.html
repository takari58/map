<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet 地図回転サンプル（CSS直書き版）</title>
    <style>
        /* --- Leafletの必須CSSを直書き --- */
        .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
        .leaflet-container { overflow: hidden; -webkit-tap-highlight-color: transparent; font-family: "Helvetica Neue", Arial, Helvetica, sans-serif; background: #ddd; outline-offset: 1px; }
        .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-user-drag: none; }
        .leaflet-tile::selection { background: transparent; }
        .leaflet-safari .leaflet-tile { image-rendering: -webkit-optimize-contrast; }
        .leaflet-safari .leaflet-tile-container { width: 0; height: 0; }
        .leaflet-tile { filter: inherit; visibility: hidden; }
        .leaflet-tile-loaded { visibility: inherit; }
        .leaflet-zoom-box { width: 0; height: 0; -moz-box-sizing: border-box; box-sizing: border-box; z-index: 800; }
        .leaflet-overlay-pane { z-index: 400; }
        .leaflet-tile-pane    { z-index: 200; }
        .leaflet-map-pane canvas { z-index: 100; }
        .leaflet-map-pane svg    { z-index: 200; }
        
        /* --- 地図のレイアウト設定 --- */
        #map {
            width: 100%;
            height: 600px;
            margin-top: 10px;
            border: 1px solid #ccc;
        }
        .controls {
            margin: 10px;
            font-family: sans-serif;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
        }
        
        /* --- 簡易的に地図全体を回転させるCSS --- */
        .rotate-wrapper {
            transition: transform 0.1s ease-out;
            transform-origin: center center;
        }
    </style>
</head>
<body>

    <div class="controls">
        <label for="angle"><b>地図の角度: </b></label>
        <input type="range" id="angle" min="0" max="360" value="0" oninput="rotateMap(this.value)">
        <span id="angle-val">0°</span>
    </div>

    <!-- 地図を包むコンテナ（これをCSSで直接回します） -->
    <div style="overflow:hidden; width:100%; height:600px; position:relative;">
        <div id="map" class="rotate-wrapper"></div>
    </div>

    <!-- 通常のLeaflet（バージョン1.9.4）をCDNで読み込み -->
    <script src="https://cloudflare.com"></script>

    <script>
        // 通常のLeafletマップを初期化
        var map = L.map('map', {
            center: [35.681236, 139.767125], // 東京駅
            zoom: 15
        });

        // OpenStreetMapを追加
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // スライダーを動かしたときに、CSSのtransformで地図コンテナごと物理的に回転させる関数
        function rotateMap(deg) {
            document.getElementById('angle-val').innerText = deg + '°';
            
            // 地図の要素をCSSで直接回転
            var mapContainer = document.getElementById('map');
            mapContainer.style.transform = 'scale(1.4) rotate(' + deg + 'deg)';
            
            // 回転による隙間を隠すために、少し拡大（scale）させています
            map.invalidateSize(); 
        }
        
        // 初期状態のサイズ調整
        document.getElementById('map').style.transform = 'scale(1.4) rotate(0deg)';
    </script>
</body>
</html>
